<!doctype html>
<html lang="en">
  <head>

    <script>
      (function () {
        var t = null;
        try { t = localStorage.getItem("theme"); } catch (e) {}
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        var r = document.documentElement;
        r.classList.toggle("dark", t === "dark");
        r.style.colorScheme = t;
        // Freeze html/body (mobile overscroll) to this first-paint color.
        r.style.setProperty("--overscroll-bg", t === "dark" ? "#0a0a0a" : "#ffffff");
      })();
    </script>

    <!-- Minimal theme variables so static shell matches light/dark before React/CSS load -->
    <style>
      @font-face {
        font-family: "JetBrains Mono";
        src: url("/fonts/JetBrainsMono-Regular.woff2") format("woff2");
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }
      :root {
        color-scheme: light;
        --background: #ffffff;
        --text: #000000;
      }
      .dark {
        --background: #0a0a0a;
        --text: #ffffff;
      }
      html, body {
        background-color: var(--overscroll-bg, var(--background));
        color: var(--text);
      }
      #root {
        background-color: var(--overscroll-bg, var(--background));
        background-image: linear-gradient(var(--background), var(--background));
        min-height: 100%;
      }
      /* Prerendered toggle is dark; follow html.dark until React hydrates. */
      [data-theme-toggle][data-ssr] *,
      [data-theme-toggle][data-ssr] *::before,
      [data-theme-toggle][data-ssr] *::after {
        transition-duration: 0ms !important;
      }
      html:not(.dark) [data-theme-toggle][data-ssr] input::before {
        left: 24px;
        background-color: var(--background);
      }
      html:not(.dark) [data-theme-toggle][data-ssr] input::after {
        top: 12px;
        right: 2px;
        width: 1px;
        height: 1px;
        border-radius: 0.5px;
        background-color: var(--text);
      }
    </style>

  <body>
    <div id="root"></div>
    <script>
      (function () {
        try {
          if ("scrollRestoration" in history) history.scrollRestoration = "manual";
          if (window.location.hash) return;
          var nav = performance.getEntriesByType && performance.getEntriesByType("navigation")[0];
          var type = nav && nav.type;
          if (type !== "reload" && type !== "back_forward") return;
          var y = parseInt(sessionStorage.getItem("scrollY"), 10);
          if (!Number.isFinite(y) || y <= 0) return;
          // #root already contains the page in production, so this sticks before first paint.
          document.documentElement.scrollTop = y;
          if (document.body) document.body.scrollTop = y;
          window.scrollTo(0, y);
          var p = document.querySelector("[data-hero-parallax]");
          if (p) {
            var w = window.innerWidth;
            var h = window.innerHeight;
            var desktop = w >= 1024;
            var short = h <= 500;
            var factor = desktop ? 0.14 : short ? 0.06 : 0.26;
            var max = desktop ? 130 : short ? 60 : 400;
            var offset = Math.max(0, Math.min(max, y * factor));
            if (!desktop) {
              var about = document.getElementById("about");
              if (about) {
                var ar = about.getBoundingClientRect();
                var ir = p.getBoundingClientRect();
                var allowed = ar.top - 16 - ir.bottom;
                if (allowed < offset) offset = Math.max(0, allowed);
              }
            }
            p.style.transform = "translate3d(0," + offset + "px,0)";
          }
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
